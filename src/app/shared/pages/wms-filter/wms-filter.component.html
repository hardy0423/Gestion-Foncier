<mat-selection-list  >
    <mat-list-option *ngFor="let category of layer.vs.category" [value]="category" checkboxPosition="before" lines="2" [matTooltip]="category.name" >
        <div fxLayout fxLayoutAlign="center center" fxLayoutGap="5px" >
            <img  
            height="25px"
            fxFlex="30px"
            [src]="
            layer.vp.url_server
            +'&SERVICE=WMS&VERSION=1.3.0&REQUEST=GetLegendGraphic&TRANSPARENT=true&LAYERS='+layer.vp.id_server
            +'&STYLE='+layer.vs.name
            +'&RULE='+category.name
            +'&WIDTH=30&HEIGHT=25&TRANSPARENT=true&RULELABEL=false&FORMAT=image/png&SYMBOLWIDTH=10&SYMBOLHEIGHT=4'
            | secure | async" 
            >
            <div fxFlex="150px" class="category-text">{{category.name}}</div>
        </div>
        
    </mat-list-option>
  </mat-selection-list>
