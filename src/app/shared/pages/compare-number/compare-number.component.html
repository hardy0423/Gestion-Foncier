<form [formGroup]="form" >
    <mat-form-field fxFlex="50px" appearance="outline"  >
        <mat-select formControlName="sign" >
          <mat-option value="">  </mat-option>
          <mat-option value="<"> < </mat-option>
          <mat-option value="="> = </mat-option>
          <mat-option value=">"> > </mat-option>
        </mat-select>
    </mat-form-field>
    <mat-form-field fxFlex="100px" appearance="outline"  >
        <input matInput type="number" placeholder="{{ 'map.attribute_tables.search' | translate}}"
            formControlName="value">
    </mat-form-field>
</form>
