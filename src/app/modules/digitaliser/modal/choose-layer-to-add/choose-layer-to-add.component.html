<h1 class="primaryColorBG white" style="padding: 6px 24px;font: 500 20px/32px Roboto, Helvetica Neue, sans-serif;text-align: center;margin: 0px;">
    {{ 'edition.choose_layer_to_add' | translate }}
</h1>
<mat-list style="padding-bottom: 24px;" >
    <mat-list-item *ngFor="let layerToAddChoose of data" (click)="choose(layerToAddChoose)"  >
        <img src="{{layerToAddChoose.img}}"  mat-list-icon style="width: 40px;height: 40px;">
        <div mat-line> {{layerToAddChoose.title }} </div>
    </mat-list-item>
</mat-list>
