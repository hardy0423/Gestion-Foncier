<h1 mat-dialog-title>
    <span class="bold primaryColor " style="font-size: 17px;">{{ 'layer.icon.edit_icon' | translate }}
    </span>
    <i mat-dialog-close class="fa fa-times primaryColor pointer close"></i>
</h1>

<mat-dialog-content>
    <app-generate-icon class="generate-icon" [background]="form.get('icon_background')"
        [iconColorForm]="form.get('icon_color')" [backgroundColor]="form.get('color')"
        [squareSvgAsText]="form.get('svg_as_text_square')" [circleSvgAsText]="form.get('svg_as_text')"
        [icon_id]="form.get('icon')" [icon_path]="form.get('icon_path')"></app-generate-icon>
</mat-dialog-content>

<mat-dialog-actions style="flex-direction: row-reverse;">
    <div fxLayout fxLayoutGap="15px" fxLayoutAlign="end">
        <mat-progress-bar fxFlex="100%" mode="indeterminate" *ngIf="form.disabled"></mat-progress-bar>
        <button fxFlex="150px" mat-stroked-button color="primary" [disabled]="form.disabled" (click)="close()">{{
            'cancel' | translate }}</button>
        <button fxFlex="150px" mat-flat-button color="accent" class="white" (click)="onAddInstance()"
            [disabled]="!form.valid || form.disabled"> {{ 'valid' | translate }} </button>
    </div>
</mat-dialog-actions>
