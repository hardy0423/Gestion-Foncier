<div class="content" fxLayout="column" fxLayoutAlign="flex-start center" fxLayoutGap="10px" *ngIf="providerStyle$ | async as style">
    <button mat-raised-button class="btn-submit" color="primary" (click)="onUpdateInstance(style)">
        <h2>
            {{ 'layer.edit_style' | translate }}
        </h2>
    </button>
    <div fxLayoutGap="30px" fxLayout class="style-item-title"   >
        <span class="title" >{{style.name}} </span>
        <img fxFlex="75px" [src]="environment.backendUrl+style.pictogram" alt="">
        <span class="state-badje" *ngIf="style.custom_style" > {{style.custom_style.name}}  </span>
        <span class="state-badje" *ngIf="!style.custom_style" > {{ 'layer.qml_file' | translate }} </span>
    </div>

    <div fxLayout>
        <img fxFlex="100%" [src]="legenUrl | secure | async" alt="">
    </div>
</div>
