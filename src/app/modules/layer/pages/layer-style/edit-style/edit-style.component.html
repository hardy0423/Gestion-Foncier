<h1 mat-dialog-title>
  <span class="bold primaryColor " style="font-size: 17px;">{{ 'layer.edit_style' | translate }}
  </span>
  <i mat-dialog-close class="fa fa-times primaryColor pointer close"></i>
</h1>


<mat-dialog-content>

  <ng-container *ngIf="provider$ | async as provider">
    <div class="select-type-style">
      <mat-button-toggle-group multiple="false" [value]="styleType | async" (change)="styleTypeChanged($event.value)">
        <mat-button-toggle [checked]="(styleType | async) == undefined" [value]="undefined">
          QML
        </mat-button-toggle>

        <ng-container *ngIf="{customStyles: (customStyles$ | async), styleType: (styleType | async)}  as context">
          <mat-button-toggle *ngFor="let customStyle of context.customStyles"
            [hidden]="provider.geometry_type != customStyle.geometry_type"
            [checked]="context?.styleType?.custom_style_id == customStyle?.custom_style_id" [value]="customStyle">
            {{ customStyle.name }}
          </mat-button-toggle>
        </ng-container>
      </mat-button-toggle-group>
    </div>
  </ng-container>

  <ng-container *ngIf="{ customStyle: (styleType | async) } as context">
    <app-qml [hidden]="context.customStyle != undefined" [provider_vector_id]="data.provider_vector_id"
      [provider_style_id]="data.provider_style_id" [styleName]="nameStyle"></app-qml>

    <app-cluster [hidden]="context.customStyle?.fucntion_name != 'pointCluster'" [customStyle]="context.customStyle"
      [provider_vector_id]="data.provider_vector_id" [provider_style_id]="data.provider_style_id" [color]="data.color"
      [icon_color]="data.icon_color" [icon]="data.icon" [icon_background]="data.icon_background"
      [styleName]="nameStyle">
    </app-cluster>

    <app-point-icon-simple [hidden]="context.customStyle?.fucntion_name != 'point_icon_simple'"
      [customStyle]="context.customStyle" [provider_vector_id]="data.provider_vector_id"
      [provider_style_id]="data.provider_style_id" [color]="data.color" [icon_color]="data.icon_color"
      [icon]="data.icon" [icon_background]="data.icon_background" [styleName]="nameStyle">
    </app-point-icon-simple>

    <app-point-diagram-simple [hidden]="context.customStyle?.fucntion_name != 'diagram_simple'"
      [customStyle]="context.customStyle" [provider_vector_id]="data.provider_vector_id"
      [provider_style_id]="data.provider_style_id" [color]="data.color" [styleName]="nameStyle"
      [id_server]="data.id_server" [path_qgis]="data.path_qgis">
    </app-point-diagram-simple>

    <app-polygon-simple [hidden]="context.customStyle?.fucntion_name != 'polygon_simple'"
      [customStyle]="context.customStyle" [provider_vector_id]="data.provider_vector_id"
      [provider_style_id]="data.provider_style_id" [strokeColor]="data.color" [fillColor]="data.icon_color"
      [styleName]="nameStyle">
    </app-polygon-simple>

    <app-line-simple [hidden]="context.customStyle?.fucntion_name != 'line_simple'" [customStyle]="context.customStyle"
      [provider_vector_id]="data.provider_vector_id" [provider_style_id]="data.provider_style_id"
      [lineColor]="data.color" [styleName]="nameStyle">
    </app-line-simple>
  </ng-container>
</mat-dialog-content>

<mat-dialog-actions>
  <div fxLayout fxLayoutGap="15px" fxLayoutAlign="end">
    <mat-progress-bar fxFlex="100%" mode="indeterminate" *ngIf="formEditStyle.disabled"></mat-progress-bar>
    <button fxFlex="150px" mat-stroked-button color="primary" [disabled]="formEditStyle.disabled" (click)="close()">{{
      'cancel' | translate }}</button>
    <button fxFlex="200px" mat-flat-button color="accent" class="white" (click)="onEditInstance()"
      [disabled]="!formEditStyle.valid || formEditStyle.disabled"> {{ 'save' | translate }} </button>
  </div>
</mat-dialog-actions>
