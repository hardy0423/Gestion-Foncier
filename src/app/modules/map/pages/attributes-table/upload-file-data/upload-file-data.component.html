<h1 mat-dialog-title>
    <span class="bold primaryColor " style="font-size: 17px;">
        {{"map.attribute_tables.update_with_excel" | translate}}
    </span>
    <i mat-dialog-close class="fa fa-times primaryColor pointer close"></i>
</h1>

<mat-dialog-content>
    <form [formGroup]="form">
        <app-file-upload *ngIf="form.get('xls_file')" formControlName="xls_file" [multiple]="false"
            [accept]="'.xlsx'">
        </app-file-upload>
    </form>

    <mat-dialog-actions>
        <div fxLayout fxLayoutGap="15px" >
            <mat-progress-bar fxFlex="100%" mode="indeterminate" *ngIf="form.disabled"></mat-progress-bar>
            <button fxFlex="150px" mat-stroked-button color="primary" [disabled]="form.disabled" (click)="close()">
                {{ 'cancel' | translate }}
            </button>
            <button fxFlex="200px" mat-flat-button color="accent" class="white" (click)="ondUpdateInstance()"
                [disabled]="!form.valid">
                {{ 'save' | translate }}
            </button>
        </div>
    </mat-dialog-actions>

</mat-dialog-content>
