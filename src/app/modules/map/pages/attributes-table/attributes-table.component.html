<h1 class="accentColorBG resizable-title mat-dialog-title">
    <span class="bold white " style="font-size: 17px;">{{inputData[0].name}}
    </span>
    <i mat-dialog-close class="fa fa-times white pointer close" (click)="closeDialog()"></i>
    <i class="fa fa-window-minimize window-position white pointer close" [matTooltip]="'reduce' | translate"
        style="margin-top: -6px;" *ngIf="windowPosition.value=='maximize'" (click)="changeWindowPosition()"></i>
    <i class="fa fa-window-maximize window-position white pointer close" [matTooltip]="'agrandir' | translate"
        *ngIf="windowPosition.value=='minimize'" (click)="changeWindowPosition()"></i>
</h1>

<div class="mat-dialog-content" [style.--tableHeightCss]="tableHeightCss">
    <div class="content-table" [style.--tableHeightCss]="tableHeightCss" fxLayout="column" *ngIf="loadingTable$|async as loadingTable; else nodata">
        <mat-accordion>
            <mat-expansion-panel class="mat-elevation-z2" [expanded]="'true'">
                <mat-expansion-panel-header>
                    <mat-panel-title style="font-weight: 900;">
                        {{"map.attribute_tables.config_buttons" | translate}}
                    </mat-panel-title>
                </mat-expansion-panel-header>

                <div fxFlex>
                    <button mat-raised-button [disabled]="selection.isEmpty()" style="padding: 10px;"
                        (click)="onZoomInstance()">
                        <mat-icon>zoom_in</mat-icon>
                        {{ 'map.attribute_tables.zoom_to_selection' | translate }}
                    </button>

                    <button mat-raised-button style="margin-left: 10px;padding: 10px;margin-right: 10px;"
                        [matMenuTriggerFor]="menuCopy" [disabled]="isLoadingDownload">
                        <mat-icon>download</mat-icon>
                        <ng-container *ngIf="selection.isEmpty()">
                            {{ 'map.attribute_tables.download_layer' | translate }}
                        </ng-container>
                        <ng-container *ngIf="!selection.isEmpty()">
                            {{ 'map.attribute_tables.download_features' | translate }}
                        </ng-container>
                        <mat-spinner style="position: absolute;left: 45%; top:16%;" diameter="25"
                            *ngIf="isLoadingDownload">
                        </mat-spinner>
                        <ng-container *ngIf="selectedFeatures$ | async"></ng-container>
                    </button>

                    <mat-paginator
                        [style.display]="paginator && paginator.pageSize === -1 ? 'none !important': 'inline-block'"
                        [length]="loadingTable.featureCount" [pageSizeOptions]="[25, 50, 100]" class="table-paginator">
                    </mat-paginator>

                    <button mat-raised-button style="padding: 10px;margin:10px" (click)="updateFilter()">
                        <ng-container *ngIf="!filterDataStatus">
                            <mat-icon>filter_alt</mat-icon>
                            {{ 'map.attribute_tables.activate_filter' | translate }}
                        </ng-container>
                        <ng-container *ngIf="filterDataStatus">
                            <mat-icon>filter_alt_off</mat-icon>
                            {{ 'map.attribute_tables.desactivate_filter' | translate }}
                        </ng-container>
                    </button>

                    <button mat-stroked-button style="padding: 10px; margin:10px" (click)="onUpdateDataInstance()"
                        *ngIf="!filterDataStatus && inputData[0].providers[0].vp.source != 'sigfile' && (inputData[0].providers[0].vp.join_tables == 'data_eap' || inputData[0].providers[0].vp.join_tables == 'data_archive' ) && inputData[0].write">
                        <mat-icon>create</mat-icon>
                        {{ 'map.attribute_tables.edit' | translate }}
                        <ng-container
                            *ngIf="inputData[0].providers[0].vp.join_tables == 'data_eap'; else data_archive ">
                            DATA-EAP
                        </ng-container>
                        <ng-template #data_archive>
                            DATA-ARCHIVE
                        </ng-template>
                    </button>

                    <button mat-stroked-button style="padding: 10px; margin:10px" (click)="onUpdateSelectionInstance()"
                        color="accent"
                        *ngIf="selection.selected.length > 1 && (inputData[0].providers[0].vp.source == 'sigfile') && inputData[0].write">
                        <mat-icon>create</mat-icon>
                        {{ 'map.attribute_tables.edit_selection' | translate }}
                    </button>

                    <button mat-stroked-button style="padding: 10px; margin:10px 0"
                        (click)="onDeleteSelectionInstance()" color="warn"
                        *ngIf="selection.selected.length > 0 && (inputData[0].providers[0].vp.source == 'sigfile') && inputData[0].write">

                        <mat-icon>clear</mat-icon>
                        {{ 'map.attribute_tables.remove_selection' | translate }}

                    </button>

                    <div [style.display]="paginator && paginator?.pageSize != -1? 'none !important': 'inline-block'"
                        class="all-feature-is-displayed">
                        {{loadingTable?.featureCount+' entité(s) filtrée(s) sont affichées'}}
                    </div>

                    <mat-menu #menuCopy="matMenu">
                        <a mat-menu-item (click)="onDownloadInstance('shp')">
                            ShapeFile
                        </a>
                        <a mat-menu-item (click)="onDownloadInstance('geojson')">
                            GeoJSON
                        </a>
                        <a mat-menu-item (click)="onDownloadInstance('gpkg')">
                            Geopackage
                        </a>
                        <a mat-menu-item (click)="onDownloadInstance('gpx')">
                            GPX
                        </a>
                        <a mat-menu-item (click)="onDownloadInstance('xlsx')">
                            Xlsx
                        </a>
                        <a mat-menu-item (click)="onDownloadInstance('csv')">
                            CSV
                        </a>
                    </mat-menu>
                </div>
            </mat-expansion-panel>
        </mat-accordion>

        <div fxFlex="100%" class="attribute-table-container"
            *ngIf="loadingTable.displayedColumns.length > 1; else nodata">

            <table mat-table [dataSource]="data$ | async" class="attribute-table" matSort
                [matSortActive]="loadingTable.displayedColumns[1]" matSortDisableClear matSortDirection="asc">

                <ng-container [formGroup]="formTable">
                    <ng-container formArrayName="rows">

                        <ng-container *ngFor="let column of loadingTable.displayedColumns; let index=index"
                            [matColumnDef]="column">

                            <ng-container *ngIf="column == 'select'">
                                <th mat-header-cell *matHeaderCellDef>
                                    <div style="width: 30px;"></div>
                                </th>
                                <td mat-cell *matCellDef="let element">
                                    <mat-checkbox (click)="$event.stopPropagation()"
                                        (change)="$event ? selection.toggle(element.id) : null"
                                        [checked]="selection.isSelected(element.id)"></mat-checkbox>
                                </td>
                            </ng-container>

                            <ng-container *ngIf="column != 'select'">
                                <th mat-header-cell mat-sort-header *matHeaderCellDef>
                                    {{column}}
                                </th>
                                <td mat-cell *matCellDef="let element; let i = index"
                                    [formGroup]="formTable.get('rows')['controls'][i]">
                                    <div [class]="(inputData[0].write) ? 'td-editable' : ''">
                                        <div>
                                            <ng-container
                                                *ngIf="editable && column == cell.column && element.id == cell.id && inputData[0].write; else not_editable">
                                                <div style="font-size: 10px;">
                                                    <mat-form-field [appearance]="'outline'"
                                                        [style.minWidth]="getValue(column, element)['typefield'] =='number' ? '60px' :'null'">
                                                        <input matInput [type]="getValue(column, element)['typefield']"
                                                            [formControlName]="column"
                                                            (click)="$event.stopPropagation()">
                                                    </mat-form-field>
                                                </div>
                                            </ng-container>
                                            <ng-template #not_editable>
                                                <span class="text-value">
                                                    {{getValue(column, element)['value']}}
                                                </span>
                                            </ng-template>
                                        </div>
                                        <ng-container
                                            *ngIf="(getValue(column, element)['name'] != 'id' )  && (inputData[0].providers[0].vp.source == 'sigfile') && inputData[0].write">
                                            <ng-container
                                                *ngIf="editable && column == cell.column && element.id == cell.id ; else not_editable_btn">
                                                <i class="fa fa-check-square check-btn"
                                                    (click)="onValidInstance({id:element.id, column:column,value:formTable.get('rows')['controls'][i].value})"
                                                    *ngIf="editable" [matTooltip]="'update_validate' | translate"></i>
                                            </ng-container>
                                            <ng-template #not_editable_btn>
                                                <i class="fa fa-pencil edit"
                                                    (click)="editField($event,element.id,column)"
                                                    [matTooltip]="'save_simple' | translate"></i>
                                            </ng-template>
                                        </ng-container>
                                    </div>

                                </td>
                            </ng-container>
                        </ng-container>

                    </ng-container>
                </ng-container>

                <ng-container *ngFor="let searchColumn of loadingTable.searchColumns; let index=index"
                    [formGroup]="form" [matColumnDef]="searchColumn.field">
                    <ng-container *ngIf="searchColumn.field == 'select1'">
                        <th mat-header-cell *matHeaderCellDef>
                            <div class="filters-container">
                                <mat-checkbox #selectAllCheckbox (click)="$event.stopPropagation()"
                                    style="margin-top: 15px;" (change)="onSelectAllFeaturesInstance($event.checked)"
                                    [checked]="selection.selected.length == loadingTable.featureCount"
                                    [indeterminate]="selection.selected.length > 0 && selection.selected.length != loadingTable.featureCount"
                                    [disabled]="constructWFSFilter().length==0"
                                    [matTooltip]="(selectAllCheckbox.disabled?'before_filter':'select_all') | translate">
                                </mat-checkbox>
                            </div>
                        </th>
                    </ng-container>
                    <ng-container *ngIf="searchColumn.field != 'select1'">
                        <th mat-header-cell *matHeaderCellDef>
                            <div class="filters-container">
                                <mat-form-field appearance="outline" *ngIf="searchColumn.fieldtype=='text'">
                                    <input matInput placeholder="{{ 'map.attribute_tables.search' | translate}}"
                                        [formControlName]="searchColumn.field">
                                </mat-form-field>
                                <div fxLayout *ngIf="searchColumn.fieldtype=='number'">
                                    <app-compare-number [result]="form.get(searchColumn.field)">
                                    </app-compare-number>
                                </div>
                            </div>
                        </th>
                    </ng-container>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="loadingTable.displayedColumns; sticky: true"></tr>
                <tr mat-header-row *matHeaderRowDef="loadingTable.getSearchColumns(); sticky: true"
                    style="height: unset;" [hidden]="!filterDataStatus">
                </tr>

                <tr mat-row class="element-row" *matRowDef="let row; columns: loadingTable.displayedColumns;"
                    (click)="selectRow(row.id) "></tr>

            </table>
        </div>

    </div>

    <ng-template #nodata>
        <div style="text-align: center;">
            {{ 'no-data' | translate }}
        </div>
    </ng-template>
    <mat-spinner style="position: absolute;left: 50%; bottom:20%;" *ngIf="isLoadingResults"></mat-spinner>
</div>
