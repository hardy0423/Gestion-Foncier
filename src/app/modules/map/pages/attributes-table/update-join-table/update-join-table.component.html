<ng-container *ngIf="loadingTable$|async as loadingTable; else nodata">


    <h1 mat-dialog-title class="accentColorBG">
        <span class="bold white " style="font-size: 17px;">
            <ng-container *ngIf="data.join_tables=='data_eap'; else data_archive">
                DATA-EAP
            </ng-container>
            <ng-template #data_archive>
                DATA-ARCHIVES
            </ng-template>
            - {{'map.attribute_tables.entities_length' | translate}} : {{loadingTable.dataCount}}
        </span>
        <i mat-dialog-close class="fa fa-times white pointer close" (click)="closeDialog()"></i>
    </h1>

    <mat-dialog-content class="dialog-content">

        <div style="height:calc(70vh - 120px)" fxLayout="column">
            <div fxFlex>

                <button mat-raised-button style="margin-left: 20px;padding: 10px;margin-right: 20px;"
                    (click)="onDownloadInstance()" [disabled]="isLoadingDownload">
                    <mat-icon>download</mat-icon>
                    {{'map.attribute_tables.download_file_excel' | translate}}
                    <mat-spinner style="position: absolute;left: 45%; top:16%;" diameter="25" *ngIf="isLoadingDownload">
                    </mat-spinner>
                </button>

                <button mat-raised-button style="padding: 10px;margin-right: 20px;" (click)="onUpdateDataInstance()"
                [matTooltip]="'map.attribute_tables.update_with_excel'|translate"    >
                    <mat-icon>create</mat-icon>
                    {{'map.attribute_tables.update_data_join_table' | translate}}
                </button>

                <mat-paginator
                    [style.display]="paginator && paginator.pageSize === -1 ? 'none !important': 'inline-block'"
                    [length]="loadingTable.dataCount" [pageSizeOptions]="[25, 50, 100]" class="table-paginator">
                </mat-paginator>

            </div>
            <div fxFlex="100%" class="attribute-table-container"
                *ngIf="loadingTable.displayedColumns.length > 1; else nodata">

                <table mat-table [dataSource]="dataTable$ | async" class="attribute-table">
                    <ng-container *ngFor="let column of loadingTable.displayedColumns; let index=index"
                        [matColumnDef]="column">

                        <ng-container>
                            <th mat-header-cell *matHeaderCellDef>
                                {{column}}
                            </th>
                            <td mat-cell *matCellDef="let element; let i = index">
                                {{element[column]}}
                            </td>
                        </ng-container>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="loadingTable.displayedColumns; sticky: true"></tr>
                    <tr mat-row class="element-row" *matRowDef="let row; columns: loadingTable.displayedColumns;"></tr>

                </table>
            </div>
        </div>
        <mat-spinner style="position: absolute;left: 50%; bottom:20%;" *ngIf="isLoadingResults"></mat-spinner>
    </mat-dialog-content>
</ng-container>

<ng-template #nodata>
    <h1 mat-dialog-title class="accentColorBG">
        <span class="bold white " style="font-size: 17px;">
            <ng-container *ngIf="data.join_tables=='data_eap'; else data_archive">
                DATA-EAP
            </ng-container>
            <ng-template #data_archive>
                DATA-ARCHIVES
            </ng-template>
            - {{'map.attribute_tables.entities_length' | translate}} : 0
        </span>
        <i mat-dialog-close class="fa fa-times white pointer close" (click)="closeDialog()"></i>
    </h1>
    <div style="text-align: center;">
        {{ 'no-data' | translate }}
    </div>
</ng-template>

<notifier-container></notifier-container>
